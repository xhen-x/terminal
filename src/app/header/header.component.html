<header class="status-bar">
    <div class="connectivity">
        <img src="wifi_connect.png" #wifi class="wifi">
        <img src="bluetooth.png" #bluetooth class="bluetooth">
    </div>
    <div class="status-info">
        <div class="status">
            <span class="Time"> {{currentTime}}</span>
            <span class="Date"> {{currentDate}}</span>
        </div>
        <div class="battery-info">
            <div class="battery">
                <svg viewBox="0 0 24 24" width="100%" height="100%">
                    <!-- green circle -->
                    <circle cx="12" cy="12" r="11.5" fill="#2ecc71"/>
                    <!-- battery body -->
                    <rect x="4" y="8.5" width="15" height="7" rx="1.5"
                        fill="none" stroke="white" stroke-width="1"/>
                    <!-- battery tip -->
                    <rect x="19" y="10.25" width="2" height="3.5" rx="0.5" fill="white"/>
                    <!-- battery bars -->
                     <!-- increasing by 3.25 -->
                    <rect x="5.25"  y="9.5" width="2.5" height="5" rx="0.5" fill="white"/>
                    <rect x="8.5"    y="9.5" width="2.5" height="5" rx="0.5" fill="white"/>
                    <rect x="11.75" y="9.5" width="2.5" height="5" rx="0.5" fill="white"/>
                </svg>
            </div>
        </div>
    </div>
    
</header>
